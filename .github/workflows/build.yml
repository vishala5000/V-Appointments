name: Build and Package V Soft Appointments

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore, Build, and Publish
      run: |
        dotnet restore ClinicApp/ClinicApp.csproj
        dotnet build ClinicApp/ClinicApp.csproj --configuration Release --no-restore
        dotnet publish ClinicApp/ClinicApp.csproj --configuration Release --output ./publish

    - name: Install Inno Setup via Chocolatey
      run: choco install innosetup -y

    - name: Compile Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ClinicApp/installer.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VSoft_Appointments_Setup
        path: ClinicApp/Output/VSoft_Appointments_Setup.exe
        retention-days: 30
