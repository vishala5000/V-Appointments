name: Build and Package Clinic App

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore, Build, and Publish
      run: |
        dotnet restore ClinicApp/ClinicApp.csproj
        dotnet build ClinicApp/ClinicApp.csproj --configuration Release --no-restore
        dotnet publish ClinicApp/ClinicApp.csproj --configuration Release --output ./publish

    - name: Download and Install Inno Setup
      run: |
        # Updated to the latest stable version (6.3.0)
        Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-6.3.0.exe" -OutFile "innosetup.exe"
        Start-Process -FilePath "innosetup.exe" -ArgumentList "/VERYSILENT /NORESTART" -Wait

    - name: Compile Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ClinicApp/installer.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClinicApp_Production_Installer
        path: ClinicApp/Output/ClinicApp_Setup.exe
        retention-days: 30
