name: Build and Package Clinic App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Required for the dotnet CLI, even though the app targets .NET Framework 4.8

    - name: Restore, Build, and Publish
      run: |
        dotnet restore ClinicApp/ClinicApp.csproj
        dotnet build ClinicApp/ClinicApp.csproj --configuration Release --no-restore
        dotnet publish ClinicApp/ClinicApp.csproj --configuration Release --output ./publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClinicApp-Windows-Release
        path: ./publish
        retention-days: 14
