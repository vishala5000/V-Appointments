name: Build and Package Clinic App

# Triggers the workflow on push or pull request events for the "main" branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Runs on the latest Windows runner provided by GitHub
    runs-on: windows-latest

    steps:
    # Step 1: Download the repository code to the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Setup the .NET SDK (Required for the dotnet CLI commands)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' 

    # Step 3: Restore NuGet packages (Downloads Newtonsoft.Json)
    - name: Restore dependencies
      run: dotnet restore ClinicApp/ClinicApp.csproj

    # Step 4: Compile the code in Release mode
    - name: Build
      run: dotnet build ClinicApp/ClinicApp.csproj --configuration Release --no-restore

    # Step 5: Publish the app into a clean, standalone folder
    - name: Publish
      run: dotnet publish ClinicApp/ClinicApp.csproj --configuration Release --output ./publish --no-build

    # Step 6: Upload the compiled .exe and DLLs as a downloadable artifact
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClinicApp-Windows-Release
        path: ./publish
        retention-days: 14
